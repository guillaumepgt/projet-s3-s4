<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un produit</title>
</head>
<body>
<h1>Ajouter un nouveau produit</h1>
<form method="POST" action="./ajouter_produit.php">
  <label for="nom">Nom du produit:</label>
  <input type="text" name="nom" id="nom" required><br><br>

  <label for="prix">Prix du produit:</label>
  <input type="number" step="0.01" name="prix" id="prix" required><br><br>

  <label for="code_barre">Code barre:</label>
  <input type="text" name="code_barre" id="code_barre" required><br><br>

  <button type="submit">Ajouter</button>
</form>
</body>
</html>

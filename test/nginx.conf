events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Définir la racine des fichiers web
        root /usr/share/nginx/html;
        index index.html index.php;

        # Gestion des fichiers statiques (CSS, JS, images)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|webp|avif)$ {
            # Autoriser sans restrictions
            allow all;
            log_not_found off;
            access_log off;
        }

        # Route pour les fichiers PHP
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Bloc commun pour limiter l'accès aux API
        # Bloc pour /api/data
        location /api/data {
            limit_except GET POST { deny all; }



            rewrite ^/api/data$ /api/data.php last;
        }

        # Bloc spécifique pour /api/data/adduser
        location /api/data/adduser {
            limit_except GET POST { deny all; }

            if ($http_user_agent ~* (Mozilla|Chrome|Safari|Edge|Trident)) {
                return 403;
            }

            fastcgi_pass php-fpm:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/api/adduser/data.php;
        }


        # Page d'erreur pour les accès interdits
        error_page 403 /403.html;

        # Gérer la page 403
        location = /403.html {
            root /usr/share/nginx/html;
        }
    }
}
